[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "realjesse", email = "154276383+realjesse@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "fastapi[standard]>=0.143.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.0",
]
